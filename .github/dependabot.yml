version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "Ciznia"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "Ciznia"
    commit-message:
      prefix: "nix"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "Ciznia"
    commit-message:
      prefix: "cargo"
