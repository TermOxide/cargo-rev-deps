name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump. `current` releases the version already in Cargo.toml."
        required: true
        type: choice
        options: [patch, minor, major, current]
      dry_run:
        description: "Bump and package without pushing, publishing or creating the release"
        required: false
        type: boolean
        default: true

# Two runs would bump from the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit and tag, create the release
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${GITHUB_REF}"
          exit 1

      # Checked before anything is pushed, so a bad token leaves no tag behind.
      # crates.io has no endpoint to inspect a token, so this sends a publish
      # with an empty .crate: the token and its scopes are checked first (401
      # or 403), and only an accepted token gets as far as rejecting the empty
      # .crate (400). Nothing can be published this way.
      - name: Check the crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi

          metadata='{"name":"cargo-rev-deps","vers":"0.0.0"}'
          perl -e 'print pack("V", length $ARGV[0]), $ARGV[0], pack("V", 0)' "$metadata" > publish-probe
          status=$(curl -s -o probe-response -w '%{http_code}' --retry 3 --max-time 20 \
            -X PUT --data-binary @publish-probe \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            -A "cargo-rev-deps-ci (https://github.com/${GITHUB_REPOSITORY})" \
            https://crates.io/api/v1/crates/new || true)
          detail=$(jq -r '.errors[0].detail // empty' probe-response 2>/dev/null || true)
          rm -f publish-probe probe-response

          case "$status" in
            400) echo "The token can publish cargo-rev-deps" ;;
            401 | 403)
              echo "::error::crates.io refuses the token (HTTP ${status}): ${detail}"
              echo "::error::It needs the publish-update scope, and its crate patterns must match cargo-rev-deps"
              exit 1
              ;;
            *)
              echo "::error::Unexpected answer from crates.io (HTTP ${status}): ${detail}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Bump version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current%%[-+]*}"
          case "$RELEASE_TYPE" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            current) next="$current" ;;
          esac

          if [[ "$next" != "$current" ]]; then
            sed -i "0,/^version = \".*\"$/s//version = \"${next}\"/" Cargo.toml
            cargo update --workspace
          fi

          echo "Releasing ${current} -> ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git commit -am "chore: release ${VERSION}"
          fi

          # A rerun of `current` finds the tag it pushed before.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [[ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::${TAG} already exists on another commit"
              exit 1
            fi
          else
            git tag -a "$TAG" -m "$TAG"
          fi

      # `cargo publish` doesn't leave the .crate in target/package, so
      # `cargo package` builds the one attached to the GitHub release.
      - name: Package
        run: |
          cargo package --locked
          cargo publish --locked --dry-run

      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/${TAG}"

      # Lets a rerun pick up after a failed publish or release.
      - name: Check crates.io
        id: crates-io
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --max-time 20 \
            -A "cargo-rev-deps-ci (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/cargo-rev-deps/${VERSION}" || true)
          case "$status" in
            200) echo "::notice::cargo-rev-deps@${VERSION} is already on crates.io"; echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup failed (HTTP ${status})"; exit 1 ;;
          esac

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run && steps.crates-io.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::The ${TAG} release already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
            target/package/cargo-rev-deps-*.crate
